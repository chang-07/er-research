const key = "sylvester_audit_v1";
let saved = JSON.parse(localStorage.getItem(key) || "{}");
function render(){
  const c = document.getElementById("cards"); c.innerHTML = "";
  rows.forEach(r => {
    const v = saved[r.id] || {};
    const d = document.createElement("div");
    d.className = "card" + (v.verdict ? " done" : "");
    d.innerHTML = `<b>#${r.id}</b> <span class="meta">event: ${r.anchor_event_type} · auto-class: ${r.classification}</span>
    <div><div class="ent"><div class="name">${esc(r.pred_name)}</div>
      <div class="meta">${r.pred_country} · ${r.pred_form} · ${r.pred_status} · <a target="_blank" href="${r.pred_gleif_url}">GLEIF</a></div></div>
    <div class="ent">→ <div class="name">${esc(r.succ_name)}</div>
      <div class="meta">${r.succ_country} · ${r.succ_form} · ${r.succ_status} · <a target="_blank" href="${r.succ_gleif_url}">GLEIF</a></div></div></div>
    <div>
      <button onclick="mark(${r.id},'real')">real ${v.verdict==='real'?'✓':''}</button>
      <button onclick="mark(${r.id},'not-real')">not-real ${v.verdict==='not-real'?'✓':''}</button>
      <button onclick="mark(${r.id},'unsure')">unsure ${v.verdict==='unsure'?'✓':''}</button>
      <input placeholder="notes" size="40" value="${esc(v.notes||'')}" onchange="note(${r.id},this.value)">
    </div>`;
    c.appendChild(d);
  });
  const n = Object.values(saved).filter(x=>x.verdict).length;
  document.getElementById("prog").textContent = ` — ${n}/${rows.length} done`;
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function mark(id,v){saved[id]={...(saved[id]||{}),verdict:v};localStorage.setItem(key,JSON.stringify(saved));render()}
function note(id,t){saved[id]={...(saved[id]||{}),notes:t};localStorage.setItem(key,JSON.stringify(saved))}
function exportCsv(){
  let out = "id,anchor_lei,candidate_lei,verdict,notes\n";
  rows.forEach(r=>{const v=saved[r.id]||{};out+=`${r.id},${r.anchor_lei},${r.candidate_lei},${v.verdict||""},"${(v.notes||"").replace(/"/g,'""')}"\n`});
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/csv"}));
  a.download="label_audit_verdicts.csv";a.click();
}
